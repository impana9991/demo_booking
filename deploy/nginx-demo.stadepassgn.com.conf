# HTTP → HTTPS redirect + ACME (certbot fills SSL or we add it after)
# Final SSL server is written by apply-spa-on-server.sh

server {
    listen 80;
    listen [::]:80;
    server_name demo.stadepassgn.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
