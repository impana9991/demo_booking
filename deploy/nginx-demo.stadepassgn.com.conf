# Demo Booking SPA + /api proxy → partner API on :4100
# Domain: demo.stadepassgn.com
# Web root: /var/www/html/parts_books
# Does not touch ticket_front_app / ticket_back_app (:8000)

server {
    listen 80;
    listen [::]:80;
    server_name demo.stadepassgn.com;

    root /var/www/html/parts_books;
    index index.html;

    # Partner Demo Booking API (not Core on 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:4100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
