# Partner Demo Booking API — port 4100 (Core ticket_back_app keeps 8000)
services:
  demo-booking-api:
    image: ${DEMO_BOOKING_IMAGE:-demo-booking-api:local}
    container_name: parts_books_api
    restart: unless-stopped
    ports:
      - "4100:4100"
    env_file:
      - .env
    environment:
      PORT: "4100"
      STADEPASS_BASE_URL: ${STADEPASS_BASE_URL:-https://book.stadepassgn.com}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
